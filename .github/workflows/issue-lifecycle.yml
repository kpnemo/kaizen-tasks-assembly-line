name: issue-lifecycle

# The labels follow the issue state, so nobody has to remember to flip them:
# closed as completed -> shipped; closed any other way -> neither; reopened -> back to implementing.
# The issue itself is closed by the facilitator after the production read-back (docs/runbook.md, Ship).

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Move implementing and shipped to match the state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          REASON: ${{ github.event.issue.state_reason }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # The payload carries the labels as they were at the event, so a removal is only
          # attempted when the label is actually there (gh errors on removing an absent label).
          has() { case ",$LABELS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          edit() { gh issue edit "$NUMBER" --repo "$REPO" "$@"; }
          if [ "$ACTION" = closed ]; then
            if has implementing; then edit --remove-label implementing; fi
            if [ "$REASON" = completed ] && ! has shipped; then edit --add-label shipped; fi
          else
            if has shipped; then edit --remove-label shipped; fi
            if has shipped || has implementing; then edit --add-label implementing; fi
          fi
